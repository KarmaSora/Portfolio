name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check private project source credential
        env:
          PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN: ${{ secrets.PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN" ]; then
            echo "::error::Add the PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN repository secret with Contents read access to showcaseSERL, python-course, OperatingSystem and database. See docs/PROJECT_SUBMODULES.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Portfolio
          NEXT_PUBLIC_ESHOP_DEMO_URL: ${{ vars.ESHOP_DEMO_URL }}

      - name: Check terminal country-input regressions
        run: python3 -B scripts/check-marvin-input.py

      - name: Add .nojekyll file
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
