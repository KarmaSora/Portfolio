name: Deploy portfolio to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    # The existing Pages deployment stays usable before Cloudflare is configured.
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        env:
          PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN: ${{ secrets.PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name. See docs/CUSTOM_DOMAIN_HOSTING.md."
              exit 1
            fi
          done
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character account ID from Cloudflare, saved as a repository Actions variable."
            exit 1
          fi

      - name: Checkout portfolio and private project sources
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PORTFOLIO_FINE_GRAINED_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio for its own hostname
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_ESHOP_DEMO_URL: ${{ vars.ESHOP_DEMO_URL }}

      - name: Check terminal country-input regressions
        run: python3 -B scripts/check-marvin-input.py

      - name: Deploy static assets and portfolio custom domain
        run: npx --yes wrangler@4.158.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: "false"
